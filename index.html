<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Preferences | Geojit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===================== -->
  <!-- MoEngage Web SDK INIT -->
  <!-- ===================== -->
  <script>
    (function (w, d, s, src, objName) {
      w.moengage_object = objName;

      w[objName] =
        w[objName] ||
        function () {
          (w[objName].q = w[objName].q || []).push(arguments);
        };

      var js = d.createElement(s);
      js.async = true;
      js.src = src;

      var fjs = d.getElementsByTagName(s)[0];
      fjs.parentNode.insertBefore(js, fjs);
    })(
      window,
      document,
      "script",
      "https://cdn.moengage.com/webpush/moe_webSdk.min.latest.js",
      "moe"
    );
  </script>

  <script>
    window.moe({
      app_id: "NIVAUUN9DMI0RXNZ3QKZCUHO",
      debug_logs: 0   /* LIVE MODE */
    });

    // Page load event
    window.moe("track_event", "customer_preferences_page_loaded");
  </script>
  <!-- ===================== -->
</head>

<body>

  <h1>Customer Preferences</h1>

  <form id="customerPreferencesForm">
    <label>
      <input type="checkbox" name="email_updates" />
      Receive Email Updates
    </label><br><br>

    <label>
      <input type="checkbox" name="whatsapp_updates" />
      Receive WhatsApp Updates
    </label><br><br>

    <button type="submit">Save Preferences</button>
  </form>

  <script>
    document
      .getElementById("customerPreferencesForm")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        const emailOptIn =
          document.querySelector('input[name="email_updates"]').checked;
        const whatsappOptIn =
          document.querySelector('input[name="whatsapp_updates"]').checked;

        // MoEngage event on preference save
        window.moe("track_event", "customer_preferences_saved", {
          email_updates: emailOptIn,
          whatsapp_updates: whatsappOptIn
        });

        alert("Preferences saved successfully");
      });
  </script>

</body>
</html>
